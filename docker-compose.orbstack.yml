services:
  worker:
    build:
      context: .
      dockerfile: docker/orbstack/worker.Dockerfile
    # Wrangler's local Browser Rendering runtime currently launches an
    # x86_64 browser. Keep the container amd64 so OrbStack can translate it
    # correctly on Apple Silicon hosts.
    platform: linux/amd64
    container_name: finance
    init: true
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      TZ: Asia/Taipei
      # Miniflare's local Browser Rendering adds --no-sandbox in CI mode.
      # OrbStack's VM does not expose a usable Chrome SUID/user-namespace
      # sandbox, so keep this isolated local container in the supported mode.
      CI: "true"
      X_BROWSER_HEADFUL: "false"
      WRANGLER_DEV_IP: 0.0.0.0
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    volumes:
      - ./apps/worker/.dev.vars:/workspace/apps/worker/.dev.vars.base:ro
      - ./apps/worker/.wrangler:/workspace/apps/worker/.wrangler
      - ./.wrangler-config:/workspace/.wrangler-config
    secrets:
      - config_encryption_key
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:8787/api/runtime')
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

secrets:
  config_encryption_key:
    file: ${CONFIG_ENCRYPTION_KEY_FILE:?Run npm run dev:orbstack so the Keychain secret can be prepared}
