name = "taiwan-fin-hub-demo"
main = "src/index.ts"
workers_dev = true
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

assets = { directory = "../web/dist", binding = "ASSETS" }
browser = { binding = "BROWSER" }
ai = { binding = "AI", remote = true }

[vars]
DEPLOYMENT_MODE = "cloud-backup"
DEMO_MODE = "true"
APP_ORIGINS = "http://127.0.0.1:8787 http://localhost:8787"

[[d1_databases]]
binding = "DB"
database_name = "taiwan-fin-hub-demo"
database_id = "6c307c81-5281-4a60-8538-6dcf3b3d0d7c"
migrations_dir = "../../packages/db/migrations"
