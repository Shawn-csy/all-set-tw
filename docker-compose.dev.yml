services:
  worker:
    image: finance-worker-dev:latest
    build:
      context: .
      dockerfile: docker/orbstack/worker.dev.Dockerfile
    platform: linux/amd64
    container_name: finance-dev
    init: true
    ports:
      - "127.0.0.1:8788:8788"
    environment:
      TZ: Asia/Taipei
      CI: "true"
      X_BROWSER_HEADFUL: "false"
      WRANGLER_DEV_IP: 0.0.0.0
      WRANGLER_DEV_PORT: 8788
      WRANGLER_CONFIG: wrangler.local.toml
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    volumes:
      - ./apps/worker/.dev.vars:/workspace/apps/worker/.dev.vars.base:ro
      - ./apps/worker/.wrangler:/workspace/apps/worker/.wrangler
      - ./.wrangler-config:/workspace/.wrangler-config
    secrets:
      - config_encryption_key
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:8788/api/runtime').then((response) => {
          if (!response.ok) process.exit(1); }).catch(() => process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

secrets:
  config_encryption_key:
    file: ${CONFIG_ENCRYPTION_KEY_FILE:?Run npm run dev:orbstack so the Keychain secret can be prepared}
